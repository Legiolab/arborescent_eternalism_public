name: Paper C reproducibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce complete public calculation chain
        run: python proofs/paper-c-modal-rarity/computational/run_all.py
      - name: Reproduce independent delayed-agentive example
        run: python proofs/paper-c-modal-rarity/computational/delayed_agentive_selection_v1_6/check.py
