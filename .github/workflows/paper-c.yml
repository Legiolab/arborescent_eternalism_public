name: Paper C reproducibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install computational dependency
        run: python -m pip install numpy
      - name: Reproduce AE event access controls
        run: python proofs/paper-c-recording-entropy/event_access_controls/check.py
      - name: Reproduce physical read controls
        run: python proofs/paper-c-recording-entropy/physical_read_controls/check.py
